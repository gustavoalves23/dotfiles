#j́ remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -ga terminal-features ",alacritty:usstyle,xterm-256color:usstyle"
set -ag terminal-overrides ",alacritty*:RGB"
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g window-style 'bg=terminal'
set -g window-active-style 'bg=terminal'
set -g default-shell /bin/zsh

# Remove delay for escape key
set -sg escape-time 0
# Add FocusEvents to trigger nvim reload file on focus
set -g focus-events on
# split panes using h and v
bind -r c split-window -h -c '#{pane_current_path}'
bind -r v split-window -v -c '#{pane_current_path}'
# preserve alacritty socket env variable
set-option -g update-environment "ALACRITTY_SOCKET ALACRITTY_WINDOW_ID HYPRLAND_CMD HYPRLAND_INSTANCE_SIGNATURE PC_DEVICE_KIND"
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Change number of window when a window is closed
set-option -g renumber-windows on
# Remap resizing
unbind '"'
unbind %

set-option -g history-limit 30000

bind -r j resize-pane -D 10
bind -r k resize-pane -U 10
bind -r l resize-pane -R 10
bind -r h resize-pane -L 10

bind -r m resize-pane -Z

# Remap new window
unbind t
bind -r t new-window

set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

# Smoother wheel/trackpad scrolling: 1 line per event (default is 5)
bind -T copy-mode    WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

bind r source-file ~/.tmux.conf

set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @smart-splits_at_edge 'stop'
set -g @smart-splits_resize_step_size '10'
# set -g @plugin 'dracula/tmux'
# set -g @dracula-plugins "synchronize-panes ssh-session"
# set -g @dracula-show-powerline true
# set -g @dracula-show-flags true
# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# Auto enter SSH Sessions when spliting panes
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @ssh-split-h-key 'c'
set -g @ssh-split-v-key 'v'
set -g @ssh-split-keep-cwd true







# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
