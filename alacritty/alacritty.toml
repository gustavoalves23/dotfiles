
[window]
opacity = 0.90
option_as_alt = "OnlyLeft"

[window.padding]
x = 16
y = 16

[font]
size = 14

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[general]
import = ["/Users/gmiyazaki/.config/alacritty/themes/tokyo-night.toml"]

[terminal]

[terminal.shell]
program = "/bin/zsh"


[keyboard]
bindings = [
  { key = "Left", mods = "Alt", chars = "\u001bb" },
  { key = "Right", mods = "Alt", chars = "\u001bf" },
]
