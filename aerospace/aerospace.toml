# Aerospace config mirroring ~/Documents/dotfiles/sway/config
# $mod = alt (cmd is reserved by macOS)

config-version = 2
start-at-login = true
after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

[mode.main.binding]
# terminal / launcher
alt-enter = 'exec-and-forget open -na Alacritty'
alt-d = 'exec-and-forget open -a Spotlight'  # swap for Raycast: open -a Raycast
alt-shift-q = 'close'

# focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# cycle monitor mode: external only -> builtin only -> both
alt-shift-m = 'exec-and-forget ~/Documents/dotfiles/aerospace/monitor-mode.sh'

# split / layout
alt-c = 'split horizontal'
alt-v = 'split vertical'
alt-s = 'layout v_accordion'            # stacking
alt-w = 'layout h_accordion'            # tabbed
alt-e = 'layout tiles horizontal vertical' # toggle split
alt-space = 'layout h_accordion tiles'  # toggle tabbed/split
alt-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'

# workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# close all other windows on workspace (closest to "kill all")
alt-shift-backspace = 'close-all-windows-but-current'

# reload config
alt-shift-c = 'reload-config'

# mute / screenshot
alt-m = 'exec-and-forget osascript -e "set volume output muted not (output muted of (get volume settings))"'
alt-shift-s = 'exec-and-forget ~/Applications/Flameshot.app/Contents/MacOS/flameshot gui --clipboard --path ~/Pictures/Screenshots'

# resize
alt-left = 'resize width -50'
alt-down = 'resize height +50'
alt-up = 'resize height -50'
alt-right = 'resize width +50'

alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
alt-r = 'mode main'

# window rules
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.flameshot.Flameshot'
run = 'layout floating'
