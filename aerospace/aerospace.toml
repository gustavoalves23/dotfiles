config-version = 2
start-at-login = true
after-login-command = []

# after-startup-command = [
#     'exec-and-forget /bin/bash -c "sleep 2 && /opt/homebrew/bin/betterdisplaycli set --originalName=LC34G55T --connectionMode=bpc:8+range:full+encoding:rgb --protectSDRColorMode=on"',
# ]

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = true

# Move the mouse to the center of the monitor when focus changes to another monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

[mode.main.binding]
# terminal / launcher
ctrl-alt-cmd-enter = 'exec-and-forget open -na Alacritty'
# ctrl-alt-cmd-enter = 'exec-and-forget open -na Kitty'
# ctrl-alt-cmd-d = 'exec-and-forget open -a Raycast'  # swap for Raycast: open -a Raycast
ctrl-alt-cmd-shift-q = 'close'

# focus
ctrl-alt-cmd-h = 'focus left'
ctrl-alt-cmd-j = 'focus down'
ctrl-alt-cmd-k = 'focus up'
ctrl-alt-cmd-l = 'focus right'

# move window
ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'

# cycle monitor mode: external only -> builtin only -> both
ctrl-alt-cmd-shift-m = 'exec-and-forget ~/Documents/dotfiles/aerospace/monitor-mode.sh'

# split / layout
# ctrl-alt-cmd-c = 'split horizontal'
ctrl-alt-cmd-v = 'split vertical'
ctrl-alt-cmd-s = 'layout v_accordion'            # stacking
ctrl-alt-cmd-w = 'layout h_accordion'            # tabbed
ctrl-alt-cmd-e = 'layout tiles horizontal vertical' # toggle split
ctrl-alt-cmd-space = 'layout h_accordion tiles'  # toggle tabbed/split
ctrl-alt-cmd-shift-space = 'layout floating tiling'
ctrl-alt-cmd-f = 'fullscreen'

# workspaces
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'
ctrl-alt-cmd-7 = 'workspace 7'
ctrl-alt-cmd-8 = 'workspace 8'
ctrl-alt-cmd-9 = 'workspace 9'
ctrl-alt-cmd-0 = 'workspace 10'

ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-cmd-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-cmd-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-cmd-shift-6 = 'move-node-to-workspace 6'
ctrl-alt-cmd-shift-7 = 'move-node-to-workspace 7'
ctrl-alt-cmd-shift-8 = 'move-node-to-workspace 8'
ctrl-alt-cmd-shift-9 = 'move-node-to-workspace 9'
ctrl-alt-cmd-shift-0 = 'move-node-to-workspace 10'

# close all other windows on workspace (closest to "kill all")
ctrl-alt-cmd-shift-backspace = 'close-all-windows-but-current'

# reload config
ctrl-alt-cmd-shift-c = 'reload-config'

# mute / screenshot
ctrl-alt-cmd-m = 'exec-and-forget osascript -e "set volume output muted not (output muted of (get volume settings))"'
alt-shift-s = 'exec-and-forget ~/Applications/Flameshot.app/Contents/MacOS/flameshot gui --clipboard --path ~/Pictures/Screenshots'

ctrl-alt-cmd-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
ctrl-alt-cmd-r = 'mode main'

# window rules
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.flameshot.Flameshot'
run = 'layout floating'

